name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-tokens:
    name: Design tokens and accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contrast gate
        run: npm run tokens:check

      - name: Upload contrast report
        run: npm run tokens:build
      - uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: packages/tokens/dist/contrast-report.json
          if-no-files-found: error

  api:
    name: API lint, typecheck, test, build
    runs-on: ubuntu-latest
    # A placeholder. Prisma needs the variable to exist in order to generate and
    # validate, and nothing in this job opens a connection: the unit tests use test
    # doubles rather than a database. Deliberately not set at workflow level, because
    # an environment variable beats a .env file, and the integration job below reads
    # its configuration from one.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @mzazicare/api

      - name: Validate the Prisma schema
        run: npm run prisma:validate -w @mzazicare/api

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov -w @mzazicare/api

      - name: Build
        run: npm run build -w @mzazicare/api

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          if-no-files-found: warn

  dashboard:
    name: Dashboard test and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A clean install on a clean machine. The bundler ships a compiled binary chosen
      # for one platform at install time, so building here rather than on a developer's
      # laptop is what keeps the production build honest: it is verified on every push
      # by a machine nobody has configured by hand.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test -w @mzazicare/dashboard

      - name: Production build
        run: npm run build -w @mzazicare/dashboard

      - name: Upload the built dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: apps/dashboard/dist/
          if-no-files-found: error

  integration:
    name: Escalation end to end
    runs-on: ubuntu-latest
    # These have to be stated here rather than left to apps/api/.env, because an
    # environment variable takes precedence over a .env file. A workflow-level
    # placeholder silently overrode the real credentials and this job failed to
    # authenticate against a database that was running and healthy.
    #
    # The credentials match docker-compose.yml, which is what actually starts here.
    env:
      DATABASE_URL: postgresql://mzazicare:mzazicare@localhost:5432/mzazicare
      REDIS_URL: redis://localhost:6379
      # The suite creates data with deliberate ages. A sweep running underneath it
      # would be a test that fails occasionally for a reason nobody can reproduce.
      RETENTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The project's own compose file rather than GitHub service containers, so the
      # Redis here has the same --notify-keyspace-events Ex the engine depends on.
      - name: Start Postgres and Redis
        run: docker compose up -d --wait

      - name: Configure the API environment
        run: |
          cp .env.example apps/api/.env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -base64 48)|" apps/api/.env
          sed -i "s|^JWT_REFRESH_SECRET=.*|JWT_REFRESH_SECRET=$(openssl rand -base64 48)|" apps/api/.env

      - name: Apply migrations and seed
        run: |
          npm run prisma:generate -w @mzazicare/api
          npm run db:deploy -w @mzazicare/api
          npm run db:seed -w @mzazicare/api

      - name: Escalation integration tests
        run: npm run test:integration -w @mzazicare/api

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
