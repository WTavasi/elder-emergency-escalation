name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma needs the variable to exist to generate a client. It never connects here.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  design-tokens:
    name: Design tokens and accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contrast gate
        run: npm run tokens:check

      - name: Upload contrast report
        run: npm run tokens:build
      - uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: packages/tokens/dist/contrast-report.json
          if-no-files-found: error

  api:
    name: API lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @mzazicare/api

      - name: Validate the Prisma schema
        run: npm run prisma:validate -w @mzazicare/api

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov -w @mzazicare/api

      - name: Build
        run: npm run build -w @mzazicare/api

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          if-no-files-found: warn

  # Integration tests against real Postgres and Redis services arrive with the
  # escalation engine, where proving a tier times out needs both.
