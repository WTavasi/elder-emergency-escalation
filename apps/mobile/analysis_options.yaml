include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

  # An analyser warning in this app is a defect waiting to happen, so the build treats
  # it as one rather than as advice.
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore

linter:
  # Map form rather than a list, because one rule has to be switched off and the
  # analyser accepts a list of names or a map of name-to-boolean, never a mix.
  rules:
    # Every widget that can be const should be, because an emergency screen rebuilding
    # its whole tree on a countdown tick is wasted work on a device that may be old.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # Names and structure.
    always_declare_return_types: true
    avoid_relative_lib_imports: true
    directives_ordering: true
    prefer_final_locals: true
    unnecessary_lambdas: true

    # Correctness that matters here specifically.
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    unawaited_futures: true
    use_build_context_synchronously: true

    # Off, and not from laziness. This rule asks for `required this._api`, which Dart
    # does not allow: a named parameter cannot start with an underscore, so taking its
    # advice on any controller here would fail to compile. It fires on every class that
    # takes a dependency as a named parameter and stores it privately, which is all of
    # them.
    prefer_initializing_formals: false
