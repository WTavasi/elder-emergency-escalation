# Local development services. Production uses Render's managed Postgres and Redis.
#
#   docker compose up -d      start
#   docker compose ps         check health
#   docker compose logs -f    follow logs
#   docker compose down       stop, keeping data
#   docker compose down -v    stop and delete data

services:
  postgres:
    image: postgres:16-alpine
    container_name: mzazicare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mzazicare
      POSTGRES_PASSWORD: mzazicare
      POSTGRES_DB: mzazicare
      # Deterministic collation, so ordering matches between dev and Render.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      # Host port is overridable: set POSTGRES_PORT in the repository-root .env
      # if something already owns 5432, for example a Homebrew Postgres.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mzazicare -d mzazicare']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mzazicare-redis
    restart: unless-stopped
    # notify-keyspace-events Ex publishes a message when a key expires, which is
    # what drives escalation timeouts. Without Ex the escalation engine would have
    # to poll, which is the design we explicitly rejected.
    # appendonly yes so a pending escalation timer survives a container restart.
    command: >
      redis-server
      --notify-keyspace-events Ex
      --appendonly yes
      --appendfsync everysec
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: the project's own road router, with Kenya's map. Not started by a plain
  # `docker compose up`, because building it takes 10 to 30 minutes and about 8 GB of
  # memory the first time. Start it on its own when you want real road times:
  #
  #   docker compose --profile routing up -d osrm
  #
  # then run the API with ROUTING_PROVIDER=osrm ROUTING_URL=http://localhost:5050
  # ROUTING_RATE_PER_SECOND=0. See infra/osrm/Dockerfile and docs/running.md.
  osrm:
    build: ./infra/osrm
    image: mzazicare-osrm
    container_name: mzazicare-osrm
    restart: unless-stopped
    profiles: ['routing']
    ports:
      - '${OSRM_PORT:-5050}:5000'

volumes:
  postgres-data:
  redis-data:
