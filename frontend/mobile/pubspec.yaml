name: mzazicare
description: MzaziCare emergency alerting for home-based elderly care.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # The design tokens, as a package rather than a copied file. One source of truth for
  # every colour, type size, spacing step and accessibility floor, generated from
  # frontend/design-tokens/tokens.json by `npm run tokens:build`.
  mzazicare_tokens:
    path: ../design-tokens

  # A plain HTTP client. The API is eight endpoints of JSON over REST, and a heavier
  # client would bring interceptors, transformers and a cache that this app has no use
  # for, in exchange for another dependency to explain.
  http: ^1.2.0

  # The tokens are a credential on a device an elder may leave on a table, so they go
  # to the Keychain and the Android Keystore rather than to shared preferences.
  # 11.x. The Jetpack Security backend behind AndroidOptions.encryptedSharedPreferences
  # was deprecated upstream and removed in 11.0.0, which is why that option is gone from
  # session_store.dart. Raises the Android floor to API 24 and the iOS floor to 12.
  flutter_secure_storage: ^11.2.0

  # Deliberately the smallest thing that works for this app's state. The elder path has
  # one signed-in session and one live emergency; a full state-management framework
  # would be more machinery than either of those needs.
  provider: ^6.1.5+1

  # Hands a tel: link to the phone's own dialler. It never places a call by itself:
  # Android opens the dialler with the number filled in and iOS asks for confirmation,
  # so no call permission is requested and the person holding the phone decides.
  url_launcher: ^6.3.2

  # Live updates while the app is open. The server speaks Socket.IO 4 on /realtime,
  # and this is the client for it; a plain WebSocket would mean reimplementing the
  # handshake, rooms and reconnection the console already gets from socket.io-client.
  socket_io_client: ^3.1.2

  # Push while the app is closed. Started only when the build is given a Firebase
  # project (see lib/core/push/firebase_config.dart), so a development build without
  # one runs unchanged. Held on the 4.x line rather than 5.0, which was days old when
  # this was added.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Where a responder is, only while they share their way there to an emergency they
  # took on (lib/core/location/). The elder's side never uses it. Baseflow's plugin is
  # the maintained one for both platforms, and its stream keeps running behind a maps
  # app through a visible foreground service on Android and the location background
  # mode on iOS. 14.1 was a month old when this was added.
  geolocator: ^14.1.1

  # Talking to the elder through the app during an emergency (lib/core/voice/). LiveKit's
  # client, over WebRTC, to a LiveKit room the API grants one emergency at a time. Audio
  # only: the token allows the microphone and nothing else. 2.13 needs Dart 3.10.
  livekit_client: ^2.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The licences ship inside the app, not just in the repository. The Open Font Licence
  # requires the licence to travel with the font, and main.dart registers these with
  # Flutter's own licence page so "About" shows them.
  assets:
    - assets/fonts/OFL-InclusiveSans.txt
    - assets/fonts/OFL-SourceSans3.txt
    - assets/fonts/OFL-AtkinsonHyperlegibleMono.txt

  # Bundled rather than fetched. Before this, the theme named faces that were never
  # loaded, so the app quietly rendered in whatever the platform happened to supply and
  # the elder screen's legibility was down to the phone rather than to a decision.
  fonts:
    # The elder's face, designed for accessibility and readability: a capital I, a
    # lowercase l and a 1 that cannot be mistaken for one another, and a slashed zero.
    # One variable file covering 300 to 700, driven by fontVariations like Source Sans 3.
    - family: Inclusive Sans
      fonts:
        - asset: assets/fonts/InclusiveSans-Variable.ttf

    # One variable file covering 200 to 900, which is smaller than three static weights
    # would be. Weight is an axis here, so the theme drives it with fontVariations.
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Variable.ttf

    # Figures, timers and identifiers, where digits have to line up. The Braille
    # Institute's monospace, from the same legibility research as Atkinson Hyperlegible,
    # with a slashed zero. One variable file covering 200 to 800.
    - family: Atkinson Hyperlegible Mono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Variable.ttf
