<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- An operator console for named people's emergencies. Nothing here should be
         indexed, previewed or cached by anything outside the deployment. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- The origin alone, never the path, so no record id leaves in a Referer header;
         Google's sign-in button needs the origin to check it is on an allowed site. -->
    <meta name="referrer" content="strict-origin" />
    <title>MzaziCare Operations</title>
    <!-- The app's icon, from frontend/brand: the white M on MzaziCare red with the care
         rings from the corner. A drawing for browsers that take one, a small picture for
         those that do not, and a larger one for a phone's home screen. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#9B0F1C" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
